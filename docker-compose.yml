services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: exporter
      POSTGRES_USER: exporter
      POSTGRES_PASSWORD: exporter
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - db-data:/var/lib/postgresql/data
      # 스키마·시드 스크립트. 볼륨이 비어 있을 때만 파일명 순서대로 1회 실행된다
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # 포트는 호스트에 노출하지 않는다 (평가 환경의 5432 충돌 방지). 접속은 docker compose exec db psql
    # 초기화(initdb) 중의 임시 서버는 Unix 소켓에서만 수신하므로, TCP(-h 127.0.0.1)로 확인해야
    # 초기화가 끝난 최종 서버가 뜬 뒤에만 healthy 가 된다
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/exporter
      SPRING_DATASOURCE_USERNAME: exporter
      SPRING_DATASOURCE_PASSWORD: exporter
      EXPORT_DIR: /data/exports
      TZ: Asia/Seoul
    volumes:
      - exports:/data/exports
    depends_on:
      db:
        condition: service_healthy
    # 진행 중인 엑셀 생성을 마칠 시간을 준다 (기본 10초)
    stop_grace_period: 60s
    # 과제 지정 고정값. 임의 변경 금지
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

volumes:
  db-data:
  exports:
