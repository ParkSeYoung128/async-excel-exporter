# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
tone_instructions: "결함 위주로 간결하게 리뷰하세요. 지적마다 근거와 영향(장애, 메모리, 데이터 정합성, 보안)을 함께 적고, 취향 수준의 스타일 지적은 하지 마세요."

reviews:
  # 사소한 지적(nitpick)을 줄이고 핵심 결함에 집중
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!gradle/wrapper/**"
    - "!.idea/**"
    - "!**/*.xlsx"

  path_instructions:
    - path: "**"
      instructions: |
        [과제 제약 - 리뷰 전제]
        - 백엔드는 컨테이너 1개, CPU 0.5 / 메모리 1GB 고정이며 수평 확장은 금지된 사전과제입니다.
        - Kafka, Redis, 별도 워커 컨테이너, 서버 증설 등 제약을 벗어나는 대안은 제안하지 마세요.
        - 구현 범위: 엑셀 생성 요청 즉시 응답, 백그라운드에서 10만 건 엑셀 생성,
          job 상태(pending/processing/done/failed), 시작·완료 시간, 파일 경로 DB 기록.

    - path: "src/main/java/**/*.java"
      instructions: |
        다음을 우선 검토하세요.
        1. 트랜잭션 경계: @Transactional self-invocation(프록시 미적용), readOnly 누락,
           @TransactionalEventListener(AFTER_COMMIT) 안에서의 DB 쓰기, 커밋 전에 비동기 작업이 시작되는 경우.
        2. 동시성/상태 전이: job 상태 변경은 조건부 UPDATE(WHERE status = ?)로 원자적으로 이뤄져야 합니다.
           같은 job이 두 번 처리되거나, 상태가 processing 에 멈출 수 있는 경로를 찾아주세요.
        3. 메모리: 10만 건을 List/엔티티로 한꺼번에 적재하는 코드(findAll, 페이지 없는 조회)를 지적하세요.
           대량 조회는 JdbcTemplate + fetchSize 스트리밍이 의도입니다.
        4. 리소스 해제: SXSSFWorkbook.dispose(), OutputStream/ResultSet, 임시 파일(.tmp) 정리,
           예외 시에도 해제되는지(try-with-resources / finally).
        5. 예외 처리: 예외를 삼켜 job이 failed 로 기록되지 않는 경우, 비동기 스레드 예외 유실.
        6. Executor 설정: 무제한 큐, 거부 정책 누락, 종료 시 대기 설정.

    - path: "src/main/java/**/*Repository.java"
      instructions: |
        - @Modifying 쿼리의 영속성 컨텍스트 불일치(clearAutomatically/flushAutomatically 필요 여부)를 확인하세요.
        - 대량 데이터를 JPA 로 조회하는 메서드가 추가되면 지적하세요.

    - path: "src/main/java/**/*Controller.java"
      instructions: |
        - 상태 코드 의미가 맞는지 확인하세요: 생성 요청 202, 미완료 파일 다운로드 409, 없는 job 404.
        - 파일 다운로드는 jobId 로 DB 에서 경로를 찾아야 하며, 클라이언트 입력 경로 사용과 path traversal 을 지적하세요.
        - 파일을 byte[] 로 메모리에 올려 반환하는 코드를 지적하세요.

    - path: "src/main/resources/**/*.sql"
      instructions: |
        - 과제 명세 스키마(orders: id INTEGER PK, user_name, product_name, category, amount INTEGER,
          status confirmed/cancelled/pending, order_date TIMESTAMP)와 일치하는지 확인하세요.
        - 시드가 최소 10만 건인지, 불필요한 인덱스가 없는지 확인하세요.

    - path: "src/main/resources/static/**"
      instructions: |
        - 진행 중 작업이 없으면 폴링이 멈추는지, 요청 중 버튼 중복 클릭이 막히는지 확인하세요.
        - innerHTML 에 서버 값을 그대로 넣는 XSS 위험을 지적하세요.

    - path: "Dockerfile"
      instructions: |
        - non-root 실행, 레이어 캐시 순서, JVM 메모리 옵션이 컨테이너 한도(1GB)에 맞는지 확인하세요.

    - path: "docker-compose.yml"
      instructions: |
        - app 서비스의 deploy.resources 값(limits 0.5 CPU / 1G, reservations 0.25 / 512M)은
          과제 지정 고정값입니다. 이 값의 변경은 절대 제안하지 마세요.
        - `docker compose up --build` 한 번으로 실행되는지(healthcheck, depends_on, 볼륨)를 확인하세요.

  tools:
    hadolint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true

chat:
  auto_reply: true
