name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --no-daemon

  compose-smoke:
    name: Docker Compose Smoke Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # 채점 환경과 동일하게 docker compose up --build 한 번으로 기동 (deploy.resources 제한 포함)
      - name: Build and start services
        run: docker compose up -d --build

      # 요청 하나가 멈춰도 전체 대기가 300초를 넘지 않도록 요청별 타임아웃 + 전체 마감 시간을 둔다
      - name: Wait for application health
        run: |
          deadline=$((SECONDS + 300))
          until curl -fsS --max-time 5 http://localhost:8080/actuator/health | grep -q '"status":"UP"'; do
            if (( SECONDS >= deadline )); then
              echo "Application did not become healthy within 300s"
              exit 1
            fi
            sleep 5
          done
          echo "Application is UP after ${SECONDS}s"

      - name: Verify seed data
        run: |
          count=$(docker compose exec -T db psql -U exporter -d exporter -tAc "SELECT count(*) FROM orders")
          echo "orders rows: ${count}"
          test "${count}" -eq 100000

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
