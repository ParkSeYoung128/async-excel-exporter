<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>데이터 요청 목록</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
<main class="container">
  <header class="page-header">
    <div class="heading">
      <p class="eyebrow">
        <svg class="eyebrow-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5h6.5L13 5v9.5H3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M9.5 1.5V5H13M5.5 8l3 4m0-4-3 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Async Excel Exporter
      </p>
      <h1>데이터 요청 목록</h1>
      <p class="subtitle">주문 데이터 전체를 엑셀 파일로 만듭니다. 요청은 즉시 접수되고, 생성은 백그라운드에서 진행됩니다.</p>
    </div>
    <button type="button" id="create-button" class="primary-button">
      <span class="button-icon" aria-hidden="true">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </span>
      <span class="spinner" aria-hidden="true"></span>
      <span id="create-label">엑셀 생성 요청</span>
    </button>
  </header>

  <div id="error-banner" class="error-banner" role="alert" hidden></div>

  <section class="panel" aria-labelledby="list-title">
    <div class="panel-header">
      <div class="panel-title">
        <h2 id="list-title">요청 내역</h2>
        <span id="total-count" class="count-chip"></span>
      </div>
      <div class="panel-tools">
        <span id="live-indicator" class="live-indicator">
          <span class="live-dot" aria-hidden="true"></span>
          <span id="status-line" aria-live="polite">불러오는 중…</span>
        </span>
        <button type="button" id="refresh-button" class="icon-button" aria-label="지금 새로고침" title="지금 새로고침">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8A5.5 5.5 0 1 1 11.9 4.1M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
        <tr>
          <th scope="col">job_id</th>
          <th scope="col">요청일시</th>
          <th scope="col">시작시간</th>
          <th scope="col">완료시간</th>
          <th scope="col" class="num">소요시간</th>
          <th scope="col">상태</th>
          <th scope="col" class="num">건수</th>
          <th scope="col">파일경로</th>
          <th scope="col" class="action">다운로드</th>
        </tr>
        </thead>
        <tbody id="job-rows"></tbody>
      </table>
    </div>

    <nav class="pager" aria-label="페이지 이동">
      <span id="page-info" class="page-info"></span>
      <div class="pager-buttons">
        <button type="button" id="prev-button" class="icon-button" aria-label="이전 페이지">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" id="next-button" class="icon-button" aria-label="다음 페이지">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </nav>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
