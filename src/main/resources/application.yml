spring:
  application:
    name: async-excel-exporter
  # 로컬 실행 기본값. 컨테이너에서는 SPRING_DATASOURCE_* 환경변수가 덮어쓴다.
  datasource:
    url: jdbc:postgresql://localhost:5432/exporter
    username: exporter
    password: exporter
    hikari:
      # 워커 1개가 작업 내내 1개를 점유하므로 API 용 여유를 남긴 최소 크기
      maximum-pool-size: 5
      # 시간 값의 출처는 DB now() 이고 컬럼은 TIMESTAMP(시간대 없음)이므로, 세션 시간대가 곧 저장값을 결정한다.
      # pgjdbc 는 접속 시 JVM 기본 시간대를 세션 TimeZone 으로 보내므로(로컬·CI 마다 다름),
      # 커넥션 생성 시점에 명시적으로 고정해 실행 환경과 무관하게 KST 로 저장되도록 한다.
      connection-init-sql: "SET TIME ZONE 'Asia/Seoul'"
  jpa:
    # 요청 처리 내내 DB 커넥션을 붙잡지 않도록 비활성화
    open-in-view: false
    hibernate:
      # 스키마는 init SQL(db/init)이 소유하고, JPA 는 엔티티와 일치하는지 검증만 한다
      ddl-auto: validate
  mvc:
    # 프레임워크 예외(400 등)도 RFC 9457 ProblemDetail 형식으로 응답
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      # 기본 200개는 0.5 CPU / 1GB 환경에 과하므로 스레드 스택 메모리를 줄인다
      max: 30

management:
  endpoints:
    web:
      exposure:
        # metrics: export.duration / export.rows 와 JVM 메모리 지표를 측정에 사용
        include: health, metrics

app:
  export:
    dir: ${EXPORT_DIR:/data/exports}
    # 진짜 대기열은 DB(pending). 메모리 큐는 작게 두고, 넘친 작업은 pending 으로 남겨 재제출한다
    queue-capacity: 10
    # 종료 시 실행 중인 작업 대기 시간. lifecycle 30초 + 25초 < compose stop_grace_period 60초
    shutdown-await-seconds: 25
    # 주문 스트리밍 조회 시 한 번에 가져오는 행 수 (0 이면 전체 적재가 되므로 금지)
    fetch-size: 1000
